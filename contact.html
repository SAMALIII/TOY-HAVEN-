<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Toy Haven</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/contact.css">
</head>
<body>

<header>
    <nav class="navbar">
        <div class="logo">Toy <span>Haven</span></div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="wishlist.html">Wishlist</a></li>
            <li>
                <a href="cart.html" class="cart-link">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="cart-count hidden">0</span>
                </a>
            </li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
        <button class="menu-btn" aria-label="Menu">
            <i class="fa-solid fa-bars"></i>
        </button>
    </nav>
</header>

<section class="contact">
    <h1>Contact Us</h1>
    <p>We would love to hear from you!</p>

    <div class="contact-container">
        <div class="contact-form">
            <form id="feedbackForm">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Your Name" required>

                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Your Email" required>

                <label for="subject">Subject</label>
                <input type="text" id="subject" placeholder="Subject" required>

                <label for="message">Message</label>
                <textarea id="message" rows="6" placeholder="Write your message..." maxlength="500" required></textarea>
                <small class="char-count" id="charCount">0 / 500 characters</small>

                <button type="submit">Send Message</button>
            </form>
        </div>

        <div class="contact-info">
            <h2>Our Information</h2>
            <p><i class="fa-solid fa-location-dot"></i> 123 Toy Street, Colombo</p>
            <p><i class="fa-solid fa-phone"></i> +94 71 234 5678</p>
            <p><i class="fa-solid fa-envelope"></i> hello@toyhaven.lk</p>
            <p><i class="fa-solid fa-clock"></i> Mon – Sat : 9.00 AM – 6.00 PM</p>
        </div>
    </div>
</section>

<footer>
    <p>© 2026 Toy Haven | All Rights Reserved</p>
</footer>

<script src="js/main.js"></script>
<script src="js/contact.js"></script>
</body>
</html>
