<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Toy Haven</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/checkout.css">
</head>
<body>

<header>
    <nav class="navbar">
        <div class="logo">Toy <span>Haven</span></div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="wishlist.html">Wishlist</a></li>
            <li>
                <a href="cart.html" class="cart-link">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="cart-count hidden">0</span>
                </a>
            </li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
        <button class="menu-btn" aria-label="Menu">
            <i class="fa-solid fa-bars"></i>
        </button>
    </nav>
</header>

<section class="checkout">
    <h1>Checkout</h1>

    <div class="checkout-container">
        <div class="checkout-form">
            <h2>Billing Details</h2>
            <form id="checkoutForm">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="example@email.com" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" placeholder="+94 7X XXX XXXX" required>
                </div>
                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" id="address" placeholder="Street Address" required>
                </div>
                <div class="form-group">
                    <label for="city">City</label>
                    <input type="text" id="city" required>
                </div>
                <div class="form-group">
                    <label for="postal">Postal Code</label>
                    <input type="text" id="postal" required>
                </div>
                <div class="form-group">
                    <label for="payment">Payment Method</label>
                    <select id="payment">
                        <option>Cash on Delivery</option>
                        <option>Credit Card</option>
                        <option>Debit Card</option>
                        <option>PayPal</option>
                    </select>
                </div>
                <button type="submit" class="place-order">Place Order</button>
            </form>
        </div>

        <div class="order-summary">
            <h2>Order Summary</h2>
            <div id="orderItems"></div>
            <hr>
            <div class="summary-row">
                <span>Total</span>
                <span id="orderTotal">Rs.0.00</span>
            </div>
        </div>
    </div>
</section>

<footer>
    <p>© 2026 Toy Haven | All Rights Reserved</p>
</footer>

<script src="js/main.js"></script>
<script src="js/checkout.js"></script>
</body>
</html>
