<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | Toy Haven</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cart.css">
</head>
<body>

<header>
    <nav class="navbar">
        <div class="logo">Toy <span>Haven</span></div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="wishlist.html">Wishlist</a></li>
            <li>
                <a href="cart.html" class="cart-link active">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="cart-count hidden">0</span>
                </a>
            </li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
        <button class="menu-btn" aria-label="Menu">
            <i class="fa-solid fa-bars"></i>
        </button>
    </nav>
</header>

<section class="cart-container">
    <h1>Your Shopping Cart</h1>

    <div class="cart-layout">
        <div class="cart-items" id="cartItems">
            <!-- LOADED BYJS -->
        </div>

        <div class="cart-summary">
            <h2>Order Summary</h2>
            <div class="summary-row">
                <span>Subtotal</span>
                <span id="subtotal">Rs.0.00</span>
            </div>
            <div class="summary-row">
                <span>Shipping</span>
                <span>Free</span>
            </div>
            <hr>
            <div class="summary-row total">
                <span>Total</span>
                <span id="total">Rs.0.00</span>
            </div>

            <a href="products.html" class="continue-btn">Continue Shopping</a>
            <a href="checkout.html" class="checkout-btn" id="checkoutBtn">Proceed to Checkout</a>
            <button class="clear-btn" id="clearCartBtn">Clear Cart</button>
        </div>
    </div>
</section>

<footer>
    <p>© 2026 Toy Haven | All Rights Reserved</p>
</footer>

<script src="js/main.js"></script>
<script src="js/cart.js"></script>
</body>
</html>
